# Copy to config.toml (git-ignored) and edit. Every key is optional.

top_home = "/home/dell/projects/finance-desktop"          # TOP checkout with data/nse.duckdb
archiver_home = "/home/dell/.cline/data/workspaces/chat/social-archiver"
# credentials.env with X_COOKIES / X_USERNAME for social-archiver (read at run time, never copied)
x_cred_file = "/home/dell/.cline/data/workspaces/chat/x-scraper-rohonchain/credentials.env"

# Every folder of archives to analyse (X: tweets.json, Telegram: posts.jsonl / messages.jsonl)
archive_roots = [
  "/home/dell/.cline/data/workspaces/chat/social-archiver/output",
  "/home/dell/.cline/data/workspaces/chat/x-scraper-rohonchain/output",
  "/home/dell/.cline/data/workspaces/chat/pyquantnews_scraper/output",
  "/home/dell/.cline/data/workspaces/chat/stocknocho/output",
]

# Sources refreshed by `daily` (short trailing window; archives are resumable and merge)
sources = [
  # { kind = "x-list", name = "https://x.com/i/lists/1518522655564918784", slug = "StockMar", days = 3 },
  # { kind = "x-handle", name = "jitu_stock", days = 3 },
  # { kind = "tg-bridge", name = "SomeIndianStockChannel", days = 3 },
]
authors = []                 # limit analysis to these handles/channels; empty = all

scan_universe = "liquid"     # liquid | nifty50 | mentioned
scan_limit = 400
min_traded_value_cr = 5.0

cost_bps = 10.0              # per side
max_hold_days = 20
default_stop_pct = 8.0

paper_capital = 10000.0
paper_max_positions = 4
copy_min_calls = 8           # creator needs this many closed 20-day calls before the copy book follows them
copy_min_score = 0.0

# Optional LLM fallback (OpenAI-compatible). Key goes in the env var, never in this file.
llm_url = ""                 # e.g. "https://api.openai.com/v1"
llm_model = ""               # e.g. "gpt-4o-mini"
llm_key_env = "SOCIAL_ALPHA_LLM_KEY"

ocr = true                   # used only when the tesseract binary is installed
background_symbols = 120     # random liquid stocks sampled for the MADE background model
background_per_symbol = 30
made_hidden = 48
made_epochs = 30
made_masks = 4
