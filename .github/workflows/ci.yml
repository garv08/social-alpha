name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Unit tests and strategy sanity
        run: python -m unittest discover -s tests

  sanity-metrics:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Backtest every strategy on synthetic bars
        run: python -m social_alpha.sanity
      - name: Publish metrics
        run: |
          {
            echo "## Strategy sanity"
            echo
            echo "Synthetic bars only. A pass means the strategy is well-formed. It is not a market return."
            echo
            python - << 'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("docs/ci/sanity-metrics.json").read_text())
          print(f"- Strategies: **{report['strategies']}**")
          print(f"- Checks: **{report['passed']} / {report['cases']}** passed")
          print(f"- Failed: **{report['failed']}**")
          print()
          print("| Strategy | Section | Trades | Return % | Max DD % |")
          print("|---|---|---:|---:|---:|")
          for row in report["rows"]:
              if row["failures"]:
                  raise SystemExit(f"{row['id']} failed {row['failures']}")
              print(f"| `{row['id']}` | {row['section']} | {row['trades']} | {row['total_return_pct']} | {row['max_drawdown_pct']} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the run
        uses: actions/upload-artifact@v4
        with:
          name: sanity-metrics
          path: |
            docs/ci/sanity-metrics.json
            docs/ci/sanity-metrics.md
          if-no-files-found: error
      - name: Keep the published table on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci/sanity-metrics.json docs/ci/sanity-metrics.md
          git diff --cached --quiet && exit 0
          git commit -m "Publish strategy sanity metrics [skip ci]"
          git push
