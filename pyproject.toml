[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "social-alpha"
version = "0.1.0"
description = "Backtest the stock calls people post on X and Telegram against TOP's Indian-market OHLC data, model them with MADE (masked autoencoder), and paper-trade the best ideas."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "garv08" }]
keywords = ["nse", "bse", "india", "social-media", "twitter", "telegram", "backtesting", "made", "autoencoder", "paper-trading"]
# TOP brings duckdb==1.1.3 (pinned for pre-SSE4.2 CPUs). Install it from a local checkout with
#   pip install -e /path/to/Trade-Observability-Platform
# or let pip fetch it from GitHub:
dependencies = [
  "trade-observability-platform @ git+https://github.com/garv08/Trade-Observability-Platform.git",
]

[project.scripts]
social-alpha = "social_alpha.cli:main"

[project.urls]
Homepage = "https://github.com/garv08/social-alpha"

[tool.setuptools.packages.find]
include = ["social_alpha*"]
