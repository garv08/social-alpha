[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "social-alpha"
version = "0.1.0"
description = "Backtest the stock calls people post on X and Telegram against TOP's Indian-market OHLC data, model them with MADE (masked autoencoder), and paper-trade the best ideas."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "garv08" }]
keywords = ["nse", "bse", "india", "social-media", "twitter", "telegram", "backtesting", "made", "autoencoder", "paper-trading"]
# DuckDB 1.1.3 is pinned because newer builds need SSE4.2 and stop with
# "illegal instruction" on the machines this project runs on.
# The TOP desk (store, OHLC sync, indicators, strategies, chart) is the
# vendored `top` package in this repo. Market data is not shipped; `top-sync`
# writes it to data/nse.duckdb.
dependencies = ["duckdb==1.1.3"]

[project.scripts]
social-alpha = "social_alpha.cli:main"
top-sync = "top.store:main"
top-platform = "top.server:main"
top-leaderboard = "top.leaderboard:main"

[project.urls]
Homepage = "https://github.com/garv08/social-alpha"

[tool.setuptools.packages.find]
include = ["social_alpha*", "top*"]

[tool.setuptools.package-data]
social_alpha = ["monitor_web/*.html", "monitor_web/vendor/*"]
top = ["web/*.html", "web/*.js", "web/*.css", "web/vendor/*"]
