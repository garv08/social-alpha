<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc">
  <title id="title">social-alpha pipeline</title>
  <desc id="desc">Cron joins new social posts to the DuckDB OHLC store, runs indicators and strategies, backtests, sorts a top 20, and opens a local chart monitor.</desc>
  <style>
    .box { fill: #f7f7f4; stroke: #222; stroke-width: 1.5; }
    .end { fill: #222; }
    .label { font: 15px system-ui, sans-serif; fill: #222; }
    .endlabel { font: 15px system-ui, sans-serif; fill: #fff; font-weight: 650; }
    .sub { font: 11px system-ui, sans-serif; fill: #555; }
    .endsub { font: 11px system-ui, sans-serif; fill: #ddd; }
    .arrow { stroke: #222; stroke-width: 1.6; fill: none; }
  </style>
  <rect width="1080" height="300" fill="#fff"/>

  <rect class="box" x="20" y="104" width="130" height="72" rx="8"/>
  <text class="label" x="85" y="134" text-anchor="middle">Cron</text>
  <text class="sub" x="85" y="154" text-anchor="middle">each run</text>

  <rect class="box" x="200" y="28" width="180" height="72" rx="8"/>
  <text class="label" x="290" y="58" text-anchor="middle">Social posts</text>
  <text class="sub" x="290" y="78" text-anchor="middle">X and Telegram</text>

  <rect class="box" x="200" y="180" width="180" height="72" rx="8"/>
  <text class="label" x="290" y="208" text-anchor="middle">DuckDB OHLC</text>
  <text class="sub" x="290" y="228" text-anchor="middle">all NSE/BSE scripts</text>

  <rect class="box" x="430" y="104" width="190" height="72" rx="8"/>
  <text class="label" x="525" y="132" text-anchor="middle">Indicators</text>
  <text class="sub" x="525" y="152" text-anchor="middle">and 95 strategies</text>

  <rect class="box" x="670" y="104" width="160" height="72" rx="8"/>
  <text class="label" x="750" y="134" text-anchor="middle">Backtester</text>
  <text class="sub" x="750" y="154" text-anchor="middle">calls + bars</text>

  <rect class="end" x="880" y="36" width="176" height="64" rx="8"/>
  <text class="endlabel" x="968" y="62" text-anchor="middle">Top 20</text>
  <text class="endsub" x="968" y="80" text-anchor="middle">paper list</text>

  <rect class="end" x="880" y="180" width="176" height="64" rx="8"/>
  <text class="endlabel" x="968" y="206" text-anchor="middle">Monitor</text>
  <text class="endsub" x="968" y="224" text-anchor="middle">local bar chart</text>

  <path class="arrow" d="M150 140 H175"/>
  <path class="arrow" d="M175 140 V64 H200"/>
  <path class="arrow" d="M175 140 V216 H200"/>
  <path class="arrow" d="M380 64 H405 V140"/>
  <path class="arrow" d="M380 216 H405 V150"/>
  <path class="arrow" d="M405 145 H430"/>
  <path class="arrow" d="M620 140 H670"/>
  <path class="arrow" d="M830 128 H855 V68 H880"/>
  <path class="arrow" d="M830 152 H855 V212 H880"/>

  <path d="M171 136 l8 4 l-8 4 z" fill="#222"/>
  <path d="M196 60 l8 4 l-8 4 z" fill="#222"/>
  <path d="M196 212 l8 4 l-8 4 z" fill="#222"/>
  <path d="M426 141 l8 4 l-8 4 z" fill="#222"/>
  <path d="M666 136 l8 4 l-8 4 z" fill="#222"/>
  <path d="M876 64 l8 4 l-8 4 z" fill="#222"/>
  <path d="M876 208 l8 4 l-8 4 z" fill="#222"/>
</svg>
