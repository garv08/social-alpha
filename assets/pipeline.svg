<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" role="img" aria-labelledby="title desc">
  <title id="title">social-alpha pipeline</title>
  <desc id="desc">Cron pulls new social posts, joins them to the latest OHLC for every script, backtests, and sorts a top 20 paper list.</desc>
  <style>
    .box { fill: #f7f7f4; stroke: #222; stroke-width: 1.5; }
    .end { fill: #222; stroke: #222; }
    .label { font: 16px system-ui, sans-serif; fill: #222; }
    .endlabel { font: 16px system-ui, sans-serif; fill: #fff; font-weight: 650; }
    .sub { font: 12px system-ui, sans-serif; fill: #555; }
    .endsub { font: 12px system-ui, sans-serif; fill: #ddd; }
    .arrow { stroke: #222; stroke-width: 1.6; fill: none; }
  </style>
  <rect width="980" height="250" fill="#fff"/>

  <rect class="box" x="24" y="78" width="150" height="78" rx="8"/>
  <text class="label" x="99" y="112" text-anchor="middle">Cron</text>
  <text class="sub" x="99" y="132" text-anchor="middle">each run</text>

  <rect class="box" x="230" y="28" width="190" height="78" rx="8"/>
  <text class="label" x="325" y="58" text-anchor="middle">Social posts</text>
  <text class="sub" x="325" y="78" text-anchor="middle">X and Telegram</text>

  <rect class="box" x="230" y="132" width="190" height="78" rx="8"/>
  <text class="label" x="325" y="162" text-anchor="middle">Latest OHLC</text>
  <text class="sub" x="325" y="182" text-anchor="middle">all NSE/BSE scripts</text>

  <rect class="box" x="490" y="78" width="190" height="78" rx="8"/>
  <text class="label" x="585" y="112" text-anchor="middle">Backtester</text>
  <text class="sub" x="585" y="132" text-anchor="middle">strategies + calls</text>

  <rect class="end" x="750" y="78" width="200" height="78" rx="8"/>
  <text class="endlabel" x="850" y="112" text-anchor="middle">Top 20</text>
  <text class="endsub" x="850" y="132" text-anchor="middle">paper list, not a broker</text>

  <path class="arrow" d="M174 104 H210"/>
  <path class="arrow" d="M210 104 V67 H230"/>
  <path class="arrow" d="M210 104 V171 H230"/>
  <path class="arrow" d="M420 67 H455 V104"/>
  <path class="arrow" d="M420 171 H455 V130"/>
  <path class="arrow" d="M455 117 H490"/>
  <path class="arrow" d="M680 117 H750"/>

  <path d="M206 100 l8 4 l-8 4 z" fill="#222"/>
  <path d="M226 63 l8 4 l-8 4 z" fill="#222"/>
  <path d="M226 167 l8 4 l-8 4 z" fill="#222"/>
  <path d="M486 113 l8 4 l-8 4 z" fill="#222"/>
  <path d="M746 113 l8 4 l-8 4 z" fill="#222"/>
</svg>
